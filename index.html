<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Detector Failure Investigation Quest</title>
<style>
:root{--navy:#102a43;--blue:#1666c5;--cyan:#20b8cd;--green:#16865b;--amber:#d98200;--red:#c43d3d;--bg:#eef4f8;--card:#fff;--muted:#627d98}
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eaf2f8,#f8fbfd);color:var(--navy)}
header{background:linear-gradient(110deg,#102a43,#0d5c91);color:white;padding:20px 24px;box-shadow:0 4px 16px #102a4328}
header h1{margin:0;font-size:clamp(22px,4vw,36px)} header p{margin:8px 0 0;color:#d9edf7}
.wrap{max-width:1100px;margin:auto;padding:20px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:white;border-radius:13px;padding:12px;text-align:center;box-shadow:0 3px 12px #102a4312}.stat b{display:block;font-size:22px;color:var(--blue)}
.progress{height:12px;background:#d9e2ec;border-radius:99px;overflow:hidden;margin:12px 0 20px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:.35s}
.card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 8px 30px #102a4318;margin-bottom:18px}.scene{display:flex;gap:18px;align-items:center}.icon{font-size:62px;background:#e8f4fb;border-radius:18px;padding:16px;min-width:100px;text-align:center}.scene h2{margin:0 0 8px}.scene p{margin:0;color:var(--muted);line-height:1.55}
.options{display:grid;gap:10px;margin-top:18px}.option{border:2px solid #d9e2ec;background:white;border-radius:12px;padding:13px 14px;text-align:left;font-size:15px;cursor:pointer;transition:.2s}.option:hover{border-color:var(--blue);transform:translateY(-1px)}.option.selected{border-color:var(--blue);background:#eaf4ff}.option.good{border-color:var(--green);background:#e8f7f0}.option.bad{border-color:var(--red);background:#fff0f0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:white}.btn.secondary{background:#829ab1}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#e7f7ef;border-left:5px solid var(--green)}.feedback.warn{background:#fff6df;border-left:5px solid var(--amber)}
.evidence{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#eaf4ff;color:#125a9c;padding:7px 10px;border-radius:99px;font-size:13px}.log{margin-top:12px;max-height:160px;overflow:auto;border-top:1px solid #e4ebf0}.log div{padding:8px 2px;border-bottom:1px solid #edf2f6;font-size:13px;color:#486581}
.result{text-align:center}.result .grade{font-size:72px;font-weight:900;color:var(--green)}.result ul{text-align:left;max-width:700px;margin:16px auto;line-height:1.7}
.hidden{display:none}@media(max-width:700px){.hud{grid-template-columns:repeat(2,1fr)}.scene{align-items:flex-start}.icon{font-size:40px;min-width:72px;padding:10px}.card{padding:16px}}
</style>
</head>
<body>
<header><h1>Metal Detector Failure Investigation Quest</h1><p>You are the auditor. Contain the risk, challenge the system, and determine the true product impact.</p></header>
<div class="wrap">
<div class="hud"><div class="stat"><b id="score">0</b>Audit Score</div><div class="stat"><b id="risk">100</b>Uncontrolled Risk</div><div class="stat"><b id="step">1/10</b>Stage</div><div class="stat"><b id="eCount">0</b>Evidence</div></div>
<div class="progress"><span id="bar"></span></div>
<div id="game" class="card"></div>
<div class="card"><h3>Evidence Folder</h3><div class="evidence" id="evidence"><span style="color:#829ab1">No evidence collected yet.</span></div><div class="log" id="log"></div></div>
</div>
<script>
const stages=[
{icon:'🚨',title:'Failure Detected',text:'A newly installed metal detector does not react to one of the three test pieces. What should you ask the auditee to demonstrate first?',options:['Please adjust the sensitivity until the test passes.','Please stop the line and repeat the challenge with all three test pieces without changing the settings.','Please continue production and contact the supplier later.'],correct:[1],evidence:'Initial failure reproduced',tip:'Preserve the original condition. A setting change before reproduction may destroy important evidence.'},
{icon:'📦',title:'Product Challenge',text:'You now need to confirm whether the verification method represents actual production.',options:['Please pass the test piece alone through the detector.','Please demonstrate the test piece together with the actual product and packaging.','Please test only an empty package.'],correct:[1],evidence:'Product-effect challenge',tip:'Testing with actual product and packaging helps reveal product effect and packaging influence.'},
{icon:'↕️',title:'Worst-Case Position',text:'The detector passes once. Which demonstrations should you request? Select all that apply.',multi:true,options:['Test piece on top of the pack.','Test piece at the centre or weakest point of the aperture.','Test piece at the bottom of the pack.','Different test-piece orientations.','Only repeat the easiest position.'],correct:[0,1,2,3],evidence:'Worst-case positions tested',tip:'A single easy pass is insufficient. Position and orientation may change detectability.'},
{icon:'🧪',title:'Test-Piece Verification',text:'One stainless-steel test piece still fails. What should you ask to see?',options:['Another certified test piece of the same metal and size, plus its identification and certificate.','A larger test piece with no record.','Any metal object available in engineering.'],correct:[0],evidence:'Reference test piece checked',tip:'An independently controlled reference helps distinguish test-piece failure from detector failure.'},
{icon:'🏷️',title:'Specification Check',text:'What physical evidence should be demonstrated?',multi:true,options:['The size and metal type marked on each test piece.','The test-piece ID and certificate or traceability record.','The approved sensitivity in the control plan and validation.','Only the colour of the test wand.'],correct:[0,1,2],evidence:'Sensitivity specification matched',tip:'The physical test piece, procedure, control plan and validation should agree.'},
{icon:'⚙️',title:'Detection or Rejection?',text:'The machine alarms but the pack remains on the accepted conveyor. What should be demonstrated?',multi:true,options:['Reject mechanism operation.','Reject timing at normal line speed.','Reject confirmation sensor and secured reject bin.','Only the detector display light.'],correct:[0,1,2],evidence:'Reject system challenged',tip:'Detection and effective rejection are separate controls. Both need demonstration.'},
{icon:'💻',title:'Programme and Settings',text:'What should the auditee demonstrate on the control panel?',multi:true,options:['The selected product programme matches the product running.','Current settings against the validated settings.','Settings-change history and access control.','Delete the event log before retesting.'],correct:[0,1,2],evidence:'Settings audit trail reviewed',tip:'A wrong programme or unauthorized setting change can create a hidden failure.'},
{icon:'🔒',title:'Affected Product',text:'How should the auditee demonstrate containment?',multi:true,options:['Physically show all affected lots under hold.','Show the ERP or inventory block.','Trace production back to the last reliable successful check.','Hold only the pack used during the failed test.'],correct:[0,1,2],evidence:'Affected lots contained',tip:'The impact window normally extends to the last reliable successful verification, or to commissioning if none exists.'},
{icon:'🔁',title:'Re-screening Trial',text:'The site proposes re-screening. What demonstrations are needed?',multi:true,options:['Challenge the validated detector before, during and after re-screening.','Show segregation and traceability of every affected lot.','Show how every reject will be isolated and investigated.','Pass product repeatedly until it is accepted.'],correct:[0,1,2],evidence:'Re-screening control verified',tip:'Re-screening must itself be controlled, traceable and performed using a demonstrated effective system.'},
{icon:'🧭',title:'Final Auditor Decision',text:'Which demonstration best supports release of affected product?',options:['A verbal assurance from production.','Repeated successful challenges, completed traceability, controlled re-screening, reject investigation and documented QA disposition.','One successful empty-belt test after repair.'],correct:[1],evidence:'Release justification established',tip:'Release requires objective evidence covering equipment effectiveness and the complete affected-product population.'}
];
let idx=0,score=0,risk=100,collected=[],selected=[];
const game=document.getElementById('game');
function render(){const s=stages[idx]; selected=[]; document.getElementById('step').textContent=`${idx+1}/${stages.length}`; document.getElementById('bar').style.width=`${idx/stages.length*100}%`;
game.innerHTML=`<div class="scene"><div class="icon">${s.icon}</div><div><h2>${s.title}</h2><p>${s.text}</p>${s.multi?'<p><b>Select all that apply.</b></p>':''}</div></div><div class="options">${s.options.map((o,i)=>`<button class="option" data-i="${i}">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div><div class="actions"><button id="check" class="btn" disabled>Submit demonstration request</button></div>`;
document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(s.multi){b.classList.toggle('selected');selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i]}else{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=[i]}document.getElementById('check').disabled=!selected.length});document.getElementById('check').onclick=check;}
function check(){const s=stages[idx], a=[...selected].sort().join(','), c=[...s.correct].sort().join(','),ok=a===c;document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(s.correct.includes(i))b.classList.add('good');else if(selected.includes(i))b.classList.add('bad')});
const fb=document.getElementById('fb');fb.className='feedback show '+(ok?'ok':'warn');fb.innerHTML=`<b>${ok?'Strong audit move':'Partly effective, but incomplete'}</b><br>${s.tip}`;if(ok){score+=10;risk=Math.max(0,risk-10);collected.push(s.evidence);addLog('Collected: '+s.evidence)}else{score+=4;risk=Math.max(0,risk-4);addLog('Learning noted: '+s.tip)}update();document.getElementById('check').remove();const next=document.createElement('button');next.className='btn';next.textContent=idx===stages.length-1?'View investigation outcome':'Continue';next.onclick=()=>{idx++;idx<stages.length?render():finish()};document.querySelector('.actions').appendChild(next)}
function addLog(t){const d=document.createElement('div');d.textContent=t;document.getElementById('log').prepend(d)}
function update(){document.getElementById('score').textContent=score;document.getElementById('risk').textContent=risk;document.getElementById('eCount').textContent=collected.length;document.getElementById('evidence').innerHTML=collected.length?collected.map(x=>`<span class="badge">✓ ${x}</span>`).join(''):'<span style="color:#829ab1">No evidence collected yet.</span>'}
function finish(){document.getElementById('bar').style.width='100%';const grade=score>=90?'A':score>=70?'B':score>=50?'C':'D';game.innerHTML=`<div class="result"><div class="grade">${grade}</div><h2>Investigation Complete</h2><p>Your audit score is <b>${score}/100</b>. Uncontrolled risk remaining: <b>${risk}%</b>.</p><ul><li>Establish the last reliable successful check.</li><li>Reproduce the failure before changing settings.</li><li>Challenge detection and rejection under actual worst-case production conditions.</li><li>Contain and trace all potentially affected product.</li><li>Require objective evidence before restart or product release.</li></ul><button class="btn" onclick="location.reload()">Play again</button></div>`}
render();
</script>
</body>
</html>
